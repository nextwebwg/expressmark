name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version committed on main
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The Playwright image carries the browsers and their system libraries, so
    # no step downloads apt packages. Keep its tag equal to the playwright pin.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    env:
      # Firefox refuses to run as root under another user's home directory.
      HOME: /root
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The container's root git reads a checkout owned by the runner's user.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global --ignore-scripts --force corepack@0.34.7
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:release
      - run: node scripts/release.mjs
        env:
          RELEASE_VERSION: ${{ inputs.version }}
