name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The Playwright image carries the browsers and their system libraries, so
    # no step downloads apt packages. Keep its tag equal to the playwright pin.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    env:
      # Firefox refuses to run as root under another user's home directory.
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.1', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The container's root git reads a checkout owned by the runner's user.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm install --global --ignore-scripts --force corepack@0.34.7
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:pr
      # The release script's own git and metadata checks, after the same build.
      - run: node scripts/release.mjs --preflight

  required:
    name: Required
    if: always()
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: test "${{ needs.verify.result }}" = success
